<body>

<h1>バーコードスキャナー</h1>

<div id="status">
  「カメラ開始」を押してください
</div>

<button id="startButton">
  カメラ開始
</button>

<div id="reader"></div>

<script>

const RELAY_URL =
  "ここにGoogle Apps ScriptのウェブアプリURLを入れる";

let scanner = null;
let scanning = false;

/*
 * 最後に読み取った時刻
 */
let lastScanTime = 0;

/*
 * 1秒間は次の読み取りを受け付けない
 */
const SCAN_INTERVAL = 1000;


/*
 * ピッ音
 */
function beep() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  const audioContext =
    new AudioContext();

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.frequency.value = 1000;

  gain.gain.value = 0.15;

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + 0.08
  );
}


/*
 * カメラ開始
 */
document
  .getElementById("startButton")
  .addEventListener(
    "click",
    startCamera
  );


async function startCamera() {

  if (scanning) {
    return;
  }

  document.getElementById("status").textContent =
    "カメラを起動しています...";

  scanner =
    new Html5Qrcode("reader");

  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        /*
         * カメラからの解析自体は10回/秒
         */
        fps: 10,

        qrbox: {
          width: 280,
          height: 160
        }
      },

      onScanSuccess,

      function () {
        // 読み取り失敗は無視
      }

    );

    scanning = true;

    document.getElementById("status").textContent =
      "バーコードをカメラに映してください";

  }

  catch (error) {

    document.getElementById("status").textContent =
      "カメラを起動できません: " + error;

  }
}
