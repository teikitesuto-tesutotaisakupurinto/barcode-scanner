<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>バーコードスキャナー</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
    }

    #status {
      font-size: 20px;
      margin: 20px 0;
      word-break: break-all;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      position: relative;
    }

    /*
     * 固定スキャン枠
     * 点滅しません
     */
    .scan-box {
      position: absolute;
      width: 280px;
      height: 160px;
      border: 3px solid white;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      box-sizing: border-box;
      pointer-events: none;
      z-index: 10;
    }

    button {
      font-size: 22px;
      padding: 15px 30px;
      margin: 10px;
    }
  </style>
</head>

<body>

<h1>バーコードスキャナー</h1>

<div id="status">
  カメラ開始を押してください
</div>

<button id="startButton">
  カメラ開始
</button>

<div id="reader">
  <div class="scan-box"></div>
</div>

<script>

const RELAY_URL =
  "https://script.google.com/macros/s/AKfycbxum4qXhHTsy9jQ9PToEagsBpvR6s7FrO5ODDVoIRiWTZ1UuQptw7lMH2gvZAhqR0bB9A/exec";


let scanner = null;

let scanning = false;


/*
 * 音声
 */
let audioContext = null;


/*
 * 最後に読み取ったバーコード
 */
let lastCode = "";


/*
 * 最後に読み取った時刻
 */
let lastScanTime = 0;


/*
 * 同じバーコードは2秒間読み取らない
 */
const SAME_CODE_INTERVAL = 2000;


/*
 * カメラ開始
 */
document
  .getElementById("startButton")
  .addEventListener(
    "click",
    startCamera
  );


async function startCamera() {

  if (scanning) {
    return;
  }


  /*
   * 音声を有効化
   */
  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (AudioContext) {

      audioContext =
        new AudioContext();

      if (
        audioContext.state === "suspended"
      ) {

        await audioContext.resume();

      }

    }

  } catch (error) {

    console.log(
      "音声初期化エラー:",
      error
    );

  }


  document.getElementById(
    "status"
  ).textContent =
    "カメラを起動しています...";


  scanner =
    new Html5Qrcode("reader");


  try {

    await scanner.start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      {
        /*
         * 点滅する標準qrboxは使わない
         */
        fps: 10,

        aspectRatio: 1.777778

      },

      onScanSuccess,

      function () {
        /*
         * 読み取り失敗は無視
         */
      }

    );


    scanning = true;


    document.getElementById(
      "status"
    ).textContent =
      "バーコードを枠の中に入れてください";


    document.getElementById(
      "startButton"
    ).textContent =
      "カメラ起動中";


    document.getElementById(
      "startButton"
    ).disabled = true;


  } catch (error) {

    document.getElementById(
      "status"
    ).textContent =
      "カメラ起動エラー: " +
      error;


    console.error(
      "カメラエラー:",
      error
    );

  }

}


/*
 * ピッ音
 */
function beep() {

  if (!audioContext) {
    return;
  }


  try {

    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      1200;


    gain.gain.setValueAtTime(
      0.25,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.12
    );


    oscillator.connect(gain);


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.12
    );


  } catch (error) {

    console.log(
      "音声エラー:",
      error
    );

  }

}


/*
 * バーコード読み取り成功
 */
async function onScanSuccess(
  decodedText
) {

  const now =
    Date.now();


  /*
   * 同じバーコードなら
   * 2秒以内は無視
   */
  if (

    decodedText === lastCode &&

    now - lastScanTime <
      SAME_CODE_INTERVAL

  ) {

    return;

  }


  /*
   * 今回のバーコードを記録
   */
  lastCode =
    decodedText;


  lastScanTime =
    now;


  /*
   * ピッ
   */
  beep();


  /*
   * 読み取った値を表示
   */
  document.getElementById(
    "status"
  ).textContent =
    "読み取り: " +
    decodedText;


  /*
   * Google Apps Scriptへ送信
   */
  try {

    await fetch(

      RELAY_URL,

      {

        method: "POST",

        mode: "no-cors",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body:
          "value=" +
          encodeURIComponent(
            decodedText
          )

      }

    );


    document.getElementById(
      "status"
    ).textContent =
      "送信しました: " +
      decodedText;


  } catch (error) {

    document.getElementById(
      "status"
    ).textContent =
      "送信エラー: " +
      error;


    console.error(
      "送信エラー:",
      error
    );

  }

}

</script>

</body>
</html>
