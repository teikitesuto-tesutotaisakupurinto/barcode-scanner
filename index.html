<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>バーコードスキャナー</title>

<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #000;
  color: #fff;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  font-size: 22px;
  margin: 10px 0;
}

#status {
  font-size: 18px;
  min-height: 30px;
  margin: 10px 0;
  word-break: break-all;
}

#camera {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: 10px auto;
  overflow: hidden;
}

#video {
  display: block;
  width: 100%;
  height: auto;
  background: #111;
}

#scanBox {
  position: absolute;
  width: 82%;
  height: 130px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border: 3px solid white;
  pointer-events: none;
  z-index: 10;
}

button {
  font-size: 20px;
  padding: 12px 25px;
  margin: 8px;
}

#result {
  font-size: 22px;
  margin: 12px;
  word-break: break-all;
}

</style>
</head>

<body>

<h1>バーコードスキャナー</h1>

<div id="status">
カメラ開始を押してください
</div>

<button id="startButton">
カメラ開始
</button>

<div id="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="scanBox"></div>

</div>

<div id="result"></div>

<script>

/*
 * Google Apps ScriptのWebアプリURL
 *
 * ここだけ自分のURLに変更
 */
const RELAY_URL =
  "https://script.google.com/macros/s/AKfycbxum4qXhHTsy9jQ9PToEagsBpvR6s7FrO5ODDVoIRiWTZ1UuQptw7lMH2gvZAhqR0bB9A/exec";


let reader = null;
let controls = null;
let running = false;


/*
 * 音声
 */
let audioContext = null;


/*
 * 同じバーコードの制限
 */
let lastCode = "";
let lastCodeTime = 0;

const SAME_CODE_INTERVAL = 2000;


/*
 * 画面
 */
const video =
  document.getElementById("video");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");

const startButton =
  document.getElementById("startButton");


/*
 * カメラ開始
 */
startButton.addEventListener(
  "click",
  startScanner
);


async function startScanner() {

  if (running) {
    return;
  }


  /*
   * 音声をユーザー操作の中で有効化
   */
  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (AudioContext) {

      audioContext =
        new AudioContext();

      if (
        audioContext.state ===
        "suspended"
      ) {

        await audioContext.resume();

      }

    }

  } catch (e) {

    console.log(e);

  }


  /*
   * HTTPS確認
   */
  if (
    location.protocol !== "https:" &&
    location.hostname !== "localhost"
  ) {

    status.textContent =
      "HTTPSで開いてください";

    return;
  }


  /*
   * ZXing確認
   */
  if (
    typeof ZXingBrowser ===
    "undefined"
  ) {

    status.textContent =
      "バーコードライブラリの読み込みに失敗しました";

    return;
  }


  status.textContent =
    "カメラを起動しています...";


  try {

    /*
     * カメラを明示的に要求
     */
    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    /*
     * 一度取得したカメラを停止
     * ZXing側で正式に取得し直す
     */
    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );


    /*
     * ZXing
     */
    reader =
      new ZXingBrowser.BrowserMultiFormatReader();


    /*
     * 背面カメラを使って連続読み取り
     */
    controls =
      await reader.decodeFromConstraints(

        {
          video: {
            facingMode: {
              ideal: "environment"
            },
            width: {
              ideal: 1280
            },
            height: {
              ideal: 720
            }
          }
        },

        video,

        function(
          resultCode,
          error
        ) {

          if (resultCode) {

            onBarcode(
              resultCode.getText()
            );

          }

        }

      );


    running = true;


    startButton.disabled =
      true;

    startButton.textContent =
      "カメラ起動中";

    status.textContent =
      "バーコードを白い枠に入れてください";


  } catch (error) {

    console.error(
      "CAMERA ERROR",
      error
    );


    status.textContent =
      "カメラ起動エラー: " +
      error.name +
      " / " +
      error.message;

  }

}


/*
 * バーコードを読み取った
 */
async function onBarcode(
  code
) {

  const now =
    Date.now();


  /*
   * 同じコードだけ2秒間無視
   */
  if (

    code === lastCode &&

    now - lastCodeTime <
      SAME_CODE_INTERVAL

  ) {

    return;

  }


  /*
   * 記録
   */
  lastCode =
    code;

  lastCodeTime =
    now;


  /*
   * ピッ
   */
  beep();


  /*
   * 表示
   */
  result.textContent =
    code;

  status.textContent =
    "読み取り: " +
    code;


  /*
   * Google Apps Scriptへ送信
   */
  try {

    await fetch(

      RELAY_URL,

      {

        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          "value=" +
          encodeURIComponent(code)

      }

    );


    status.textContent =
      "送信しました: " +
      code;


  } catch (error) {

    console.error(
      "SEND ERROR",
      error
    );


    status.textContent =
      "送信エラー: " +
      error.message;

  }

}


/*
 * ピッ音
 */
function beep() {

  if (!audioContext) {
    return;
  }


  try {

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type =
      "sine";

    oscillator.frequency.value =
      1200;


    gain.gain.setValueAtTime(
      0.25,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.12
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.12
    );


  } catch (error) {

    console.log(
      "BEEP ERROR",
      error
    );

  }

}

</script>

</body>
</html>
