<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>バーコードスキャナー</title>

<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: white;
  color: black;

  font-family: sans-serif;
  text-align: center;
}

h1 {
  font-size: 22px;
  margin: 15px 0;
}

#status {
  font-size: 18px;
  min-height: 30px;
  margin: 10px;

  word-break: break-all;
}


/* カメラ表示 */

#camera {

  position: relative;

  width: 100%;
  max-width: 600px;

  height: 230px;

  margin: 15px auto;

  background: white;

  overflow: hidden;
}


/* カメラ映像 */

#video {

  position: absolute;

  width: 82%;
  height: 130px;

  left: 9%;
  top: 50px;

  object-fit: cover;

  background: #ddd;
}


/* 固定枠 */

#scanBox {

  position: absolute;

  width: 82%;
  height: 130px;

  left: 50%;
  top: 115px;

  transform:
    translate(-50%, -50%);

  border: 3px solid black;

  pointer-events: none;

  z-index: 10;
}


/* ボタン */

button {

  font-size: 20px;

  padding:
    12px 20px;

  margin: 6px;

}


/* 結果 */

#result {

  font-size: 22px;

  margin: 15px;

  word-break: break-all;

}

</style>

</head>


<body>


<h1>
バーコードスキャナー
</h1>


<div id="status">
カメラ開始を押してください
</div>


<button id="startButton">
カメラ開始
</button>


<button
  id="switchButton"
  disabled
>
カメラ切替
</button>


<div id="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="scanBox"></div>

</div>


<div id="result"></div>


<script>


/*
 * Google Apps ScriptのURL
 */
const RELAY_URL =
  "https://script.google.com/macros/s/AKfycbxum4qXhHTsy9jQ9PToEagsBpvR6s7FrO5ODDVoIRiWTZ1UuQptw7lMH2gvZAhqR0bB9A/exec";


/*
 * ZXing
 */
let reader = null;

let controls = null;


/*
 * カメラ一覧
 */
let cameras = [];


/*
 * 現在のカメラ番号
 */
let currentCamera = 0;


/*
 * 起動状態
 */
let running = false;


/*
 * 音声
 */
let audioContext = null;


/*
 * 同じバーコード制限
 */
let lastCode = "";

let lastCodeTime = 0;

const SAME_CODE_INTERVAL = 2000;


/*
 * HTML
 */
const video =
  document.getElementById(
    "video"
  );


const status =
  document.getElementById(
    "status"
  );


const result =
  document.getElementById(
    "result"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const switchButton =
  document.getElementById(
    "switchButton"
  );


/*
 * カメラ開始
 */
startButton.addEventListener(
  "click",
  startCamera
);


/*
 * カメラ切替
 */
switchButton.addEventListener(
  "click",
  switchCamera
);


/*
 * カメラ開始
 */
async function startCamera() {


  if (running) {
    return;
  }


  status.textContent =
    "カメラを確認しています...";


  /*
   * 音声
   */
  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (AudioContext) {

      audioContext =
        new AudioContext();


      if (
        audioContext.state ===
        "suspended"
      ) {

        await audioContext.resume();

      }

    }

  } catch (error) {

    console.log(error);

  }


  /*
   * カメラ許可
   */
  try {

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: true,

          audio: false

        });


    /*
     * カメラ一覧取得
     */
    const devices =
      await navigator
        .mediaDevices
        .enumerateDevices();


    cameras =
      devices.filter(
        function(device) {

          return (
            device.kind ===
            "videoinput"
          );

        }
      );


    /*
     * 最初のカメラを選択
     */
    currentCamera = 0;


    /*
     * 確認用ストリーム停止
     */
    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    if (cameras.length === 0) {

      throw new Error(
        "カメラが見つかりません"
      );

    }


    /*
     * ZXing
     */
    reader =
      new
      ZXingBrowser
        .BrowserMultiFormatReader();


    /*
     * カメラ起動
     */
    await startSelectedCamera();


    running = true;


    startButton.disabled =
      true;


    switchButton.disabled =
      false;


  } catch (error) {

    console.error(error);


    status.textContent =
      "カメラ起動エラー: " +
      error.name +
      " / " +
      error.message;

  }

}


/*
 * 選択中のカメラを起動
 */
async function startSelectedCamera() {


  /*
   * 以前のカメラを停止
   */
  if (controls) {

    try {

      controls.stop();

    } catch (error) {

      console.log(error);

    }

    controls = null;

  }


  const camera =
    cameras[currentCamera];


  if (!camera) {

    return;

  }


  status.textContent =
    "カメラを起動しています...";


  /*
   * カメラ名表示
   */
  status.textContent =
    "使用カメラ: " +
    (
      camera.label ||
      "カメラ " +
      (currentCamera + 1)
    );


  /*
   * 指定したカメラを起動
   */
  controls =
    await reader
      .decodeFromVideoDevice(

        camera.deviceId,

        video,

        function(
          resultCode,
          error
        ) {


          if (resultCode) {

            onBarcode(
              resultCode.getText()
            );

          }

        }

      );


}


/*
 * カメラ切替
 */
async function switchCamera() {


  if (!cameras.length) {

    return;

  }


  /*
   * 次のカメラへ
   */
  currentCamera =
    (
      currentCamera + 1
    ) %
    cameras.length;


  try {

    await startSelectedCamera();

  } catch (error) {

    status.textContent =
      "カメラ切替エラー: " +
      error.name +
      " / " +
      error.message;

  }

}


/*
 * バーコード読み取り
 */
async function onBarcode(code) {


  const now =
    Date.now();


  /*
   * 同じバーコードは
   * 2秒以内なら無視
   */
  if (

    code === lastCode &&

    now - lastCodeTime <
      SAME_CODE_INTERVAL

  ) {

    return;

  }


  lastCode =
    code;


  lastCodeTime =
    now;


  /*
   * ピッ
   */
  beep();


  /*
   * 表示
   */
  result.textContent =
    code;


  status.textContent =
    "読み取り: " +
    code;


  /*
   * Apps Scriptへ送信
   */
  try {

    await fetch(

      RELAY_URL,

      {

        method:
          "POST",

        mode:
          "no-cors",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body:
          "value=" +
          encodeURIComponent(
            code
          )

      }

    );


    status.textContent =
      "送信しました: " +
      code;


  } catch (error) {

    status.textContent =
      "送信エラー: " +
      error.message;

  }

}


/*
 * ピッ音
 */
function beep() {


  if (!audioContext) {

    return;

  }


  try {


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      1200;


    gain.gain.setValueAtTime(

      0.25,

      audioContext.currentTime

    );


    gain.gain
      .exponentialRampToValueAtTime(

        0.001,

        audioContext.currentTime +
        0.12

      );


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(

      audioContext.currentTime +
      0.12

    );


  } catch (error) {

    console.log(error);

  }

}

</script>

</body>

</html>
