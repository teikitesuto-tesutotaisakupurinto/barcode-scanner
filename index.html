<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>バーコードスキャナー</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #status {
      font-size: 20px;
      margin: 20px 0;
      word-break: break-all;
    }

    button {
      font-size: 20px;
      padding: 12px 25px;
    }
  </style>
</head>

<body>

<h1>バーコードスキャナー</h1>

<div id="status">
  「カメラ開始」を押してください
</div>

<button id="startButton">
  カメラ開始
</button>

<div id="reader"></div>

<script>

const RELAY_URL =
  "https://script.google.com/macros/s/AKfycbxum4qXhHTsy9jQ9PToEagsBpvR6s7FrO5ODDVoIRiWTZ1UuQptw7lMH2gvZAhqR0bB9A/exec";


let scanner = null;

let scanning = false;


/*
 * 音声用
 */
let audioContext = null;


/*
 * 最後に読み取ったバーコード
 */
let lastCode = "";


/*
 * 最後に読み取った時刻
 */
let lastScanTime = 0;


/*
 * 同じバーコードを再読み取りするまでの時間
 *
 * 2000 = 2秒
 */
const SAME_CODE_INTERVAL = 2000;


/*
 * カメラ開始ボタン
 */
document
  .getElementById("startButton")
  .addEventListener(
    "click",
    startCamera
  );


/*
 * カメラ開始
 */
async function startCamera() {

  if (scanning) {
    return;
  }


  /*
   * 音声をユーザー操作で有効化
   */
  try {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();
    }

  } catch (error) {

    console.log(
      "音声を有効化できません:",
      error
    );
  }


  document.getElementById(
    "status"
  ).textContent =
    "カメラを起動しています...";


  scanner =
    new Html5Qrcode("reader");


  try {

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 160
        }
      },

      onScanSuccess,

      function () {
        /*
         * 読み取り失敗は無視
         */
      }

    );


    scanning = true;


    document.getElementById(
      "status"
    ).textContent =
      "バーコードをカメラに映してください";


  } catch (error) {

    document.getElementById(
      "status"
    ).textContent =
      "カメラを起動できません: " +
      error;

  }
}


/*
 * 読み取り音
 */
function beep() {

  if (!audioContext) {
    return;
  }


  try {

    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.frequency.value =
      1000;


    gain.gain.setValueAtTime(
      0.2,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.1
    );


    oscillator.connect(gain);


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.1
    );

  } catch (error) {

    console.log(
      "ビープ音エラー:",
      error
    );

  }
}


/*
 * バーコード読み取り成功
 */
async function onScanSuccess(
  decodedText
) {

  const now =
    Date.now();


  /*
   * 同じバーコードなら
   * 2秒以内は無視
   */
  if (

    decodedText ===
      lastCode &&

    now - lastScanTime <
      SAME_CODE_INTERVAL

  ) {

    return;
  }


  /*
   * 今回のバーコードを記録
   */
  lastCode =
    decodedText;


  lastScanTime =
    now;


  /*
   * ピッ
   */
  beep();


  /*
   * 読み取った数字を表示
   */
  document.getElementById(
    "status"
  ).textContent =
    "読み取り: " +
    decodedText;


  /*
   * Google Apps Scriptへ送信
   */
  try {

    await fetch(

      RELAY_URL,

      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          "value=" +
          encodeURIComponent(
            decodedText
          )
      }

    );


    document.getElementById(
      "status"
    ).textContent =
      "送信しました: " +
      decodedText;


  } catch (error) {

    document.getElementById(
      "status"
    ).textContent =
      "送信エラー: " +
      error;

  }

}

</script>

</body>
</html>
