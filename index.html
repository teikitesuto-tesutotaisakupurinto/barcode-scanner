<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>バーコードスキャナー</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

<style>

html,
body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  font-size: 22px;
  margin: 15px 0;
}

#status {
  font-size: 18px;
  min-height: 28px;
  margin: 10px;
  word-break: break-all;
}

#cameraArea {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: auto;
  overflow: hidden;
}

#video {
  display: block;
  width: 100%;
  height: auto;
  background: #111;
}

#scanBox {
  position: absolute;

  width: 82%;
  height: 130px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border: 3px solid white;

  box-sizing: border-box;

  pointer-events: none;

  /*
   * 点滅・アニメーションは一切なし
   */
}

#startButton {
  font-size: 20px;
  padding: 12px 25px;
  margin: 15px;
}

#result {
  font-size: 22px;
  margin: 15px;
  word-break: break-all;
}

</style>
</head>

<body>

<h1>バーコードスキャナー</h1>

<div id="status">
カメラ開始を押してください
</div>

<button id="startButton">
カメラ開始
</button>

<div id="cameraArea">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="scanBox"></div>

</div>

<div id="result"></div>


<script>

/*
 * Google Apps ScriptのWebアプリURL
 *
 * ここを自分のURLに変更してください。
 */
const RELAY_URL =
  "https://script.google.com/macros/s/AKfycbxum4qXhHTsy9jQ9PToEagsBpvR6s7FrO5ODDVoIRiWTZ1UuQptw7lMH2gvZAhqR0bB9A/exec";


/*
 * ZXing
 */
let codeReader = null;


/*
 * カメラ起動状態
 */
let cameraRunning = false;


/*
 * 音声
 */
let audioContext = null;


/*
 * 最後に読み取ったコード
 */
let lastCode = "";


/*
 * 最後に読み取った時刻
 */
let lastScanTime = 0;


/*
 * 同じバーコードを2秒以内に
 * 再読み取りしない
 */
const SAME_CODE_INTERVAL = 2000;


/*
 * DOM
 */
const video =
  document.getElementById("video");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");

const startButton =
  document.getElementById("startButton");


/*
 * カメラ開始
 */
startButton.addEventListener(
  "click",
  startCamera
);


async function startCamera() {

  if (cameraRunning) {
    return;
  }


  status.textContent =
    "カメラを起動しています...";


  /*
   * 音声をユーザー操作の中で初期化
   */
  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (AudioContext) {

      audioContext =
        new AudioContext();


      if (
        audioContext.state ===
        "suspended"
      ) {

        await audioContext.resume();

      }

    }

  } catch (error) {

    console.log(
      "音声初期化エラー",
      error
    );

  }


  /*
   * カメラの存在を確認
   */
  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    status.textContent =
      "このブラウザではカメラを利用できません";

    return;
  }


  /*
   * ZXingを確認
   */
  if (
    typeof ZXing ===
    "undefined"
  ) {

    status.textContent =
      "バーコードライブラリを読み込めません";

    return;
  }


  try {

    /*
     * まずカメラへのアクセスを直接確認
     */
    const testStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    /*
     * テスト用ストリームを停止
     */
    testStream
      .getTracks()
      .forEach(
        track => track.stop()
      );


    /*
     * ZXingを起動
     */
    codeReader =
      new ZXing.BrowserMultiFormatReader();


    cameraRunning = true;


    startButton.disabled =
      true;


    startButton.textContent =
      "カメラ起動中";


    status.textContent =
      "バーコードを白い枠に入れてください";


    /*
     * 背面カメラを指定
     */
    const constraints = {

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }

      }

    };


    /*
     * バーコード読み取り開始
     */
    codeReader.decodeFromConstraints(

      constraints,

      video,

      function(result, error) {

        if (result) {

          handleBarcode(
            result.getText()
          );

        }

      }

    );


  } catch (error) {

    cameraRunning = false;


    startButton.disabled =
      false;


    startButton.textContent =
      "カメラ開始";


    status.textContent =
      "カメラ起動エラー: " +
      error.name +
      " / " +
      error.message;


    console.error(
      error
    );

  }

}


/*
 * バーコード処理
 */
async function handleBarcode(
  code
) {

  const now =
    Date.now();


  /*
   * 同じコードなら
   * 2秒以内は無視
   */
  if (

    code === lastCode &&

    now - lastScanTime <
      SAME_CODE_INTERVAL

  ) {

    return;

  }


  /*
   * 記録
   */
  lastCode =
    code;

  lastScanTime =
    now;


  /*
   * ピッ
   */
  beep();


  /*
   * 画面表示
   */
  result.textContent =
    code;

  status.textContent =
    "読み取り: " +
    code;


  /*
   * Google Apps Scriptへ送信
   */
  try {

    await fetch(

      RELAY_URL,

      {

        method: "POST",

        mode: "no-cors",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body:
          "value=" +
          encodeURIComponent(code)

      }

    );


    status.textContent =
      "送信しました: " +
      code;


  } catch (error) {

    status.textContent =
      "送信エラー: " +
      error.message;

    console.error(
      error
    );

  }

}


/*
 * ピッ音
 */
function beep() {

  if (!audioContext) {
    return;
  }


  try {

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      1200;


    gain.gain.setValueAtTime(
      0.25,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,

      audioContext.currentTime +
      0.12
    );


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(

      audioContext.currentTime +
      0.12

    );


  } catch (error) {

    console.log(
      "ビープ音エラー",
      error
    );

  }

}

</script>

</body>
</html>
