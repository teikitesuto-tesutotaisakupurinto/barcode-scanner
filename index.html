<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>バーコードスキャナー</title>

<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: white;
  color: black;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  font-size: 22px;
  margin: 15px 0;
}

#status {
  font-size: 18px;
  min-height: 30px;
  margin: 10px;
  word-break: break-all;
}

/*
 * カメラ表示領域
 */
#camera {
  position: relative;

  width: 100%;
  max-width: 600px;

  height: 230px;

  margin: 15px auto;

  background: white;

  overflow: hidden;
}

/*
 * カメラ映像
 *
 * 枠の中だけに表示
 */
#video {
  position: absolute;

  width: 82%;
  height: 130px;

  left: 9%;
  top: 50px;

  object-fit: cover;

  background: #ddd;
}

/*
 * 固定枠
 */
#scanBox {
  position: absolute;

  width: 82%;
  height: 130px;

  left: 50%;
  top: 115px;

  transform: translate(-50%, -50%);

  border: 3px solid black;

  pointer-events: none;

  z-index: 10;
}

button {
  font-size: 20px;
  padding: 12px 25px;
  margin: 8px;
}

#result {
  font-size: 22px;
  margin: 15px;
  word-break: break-all;
}

</style>
</head>

<body>

<h1>バーコードスキャナー</h1>

<div id="status">
カメラ開始を押してください
</div>

<button id="startButton">
カメラ開始
</button>

<div id="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="scanBox"></div>

</div>

<div id="result"></div>

<script>

/*
 * Google Apps ScriptのWebアプリURL
 */
const RELAY_URL =
  "https://script.google.com/macros/s/AKfycbxum4qXhHTsy9jQ9PToEagsBpvR6s7FrO5ODDVoIRiWTZ1UuQptw7lMH2gvZAhqR0bB9A/exec";


let reader = null;
let controls = null;
let running = false;

let audioContext = null;

let lastCode = "";
let lastCodeTime = 0;

const SAME_CODE_INTERVAL = 2000;


const video =
  document.getElementById("video");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");

const startButton =
  document.getElementById("startButton");


/*
 * カメラ開始
 */
startButton.addEventListener(
  "click",
  startScanner
);


async function startScanner() {

  if (running) {
    return;
  }

  status.textContent =
    "カメラを確認しています...";


  /*
   * 音声を初期化
   */
  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (AudioContext) {

      audioContext =
        new AudioContext();

      if (
        audioContext.state ===
        "suspended"
      ) {

        await audioContext.resume();

      }
    }

  } catch (error) {

    console.log(error);

  }


  /*
   * HTTPS確認
   */
  if (
    location.protocol !== "https:" &&
    location.hostname !== "localhost"
  ) {

    status.textContent =
      "HTTPSで開いてください";

    return;
  }


  /*
   * カメラAPI確認
   */
  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    status.textContent =
      "このブラウザではカメラを利用できません";

    return;
  }


  /*
   * ZXing確認
   */
  if (
    typeof ZXingBrowser ===
    "undefined"
  ) {

    status.textContent =
      "バーコードライブラリを読み込めません";

    return;
  }


  try {

    /*
     * 最初にカメラ許可を取得
     *
     * ここではカメラを指定しない
     */
    const initialStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: true,

          audio: false

        });


    /*
     * カメラ一覧を取得
     */
    const devices =
      await navigator.mediaDevices
        .enumerateDevices();


    const cameras =
      devices.filter(
        function(device) {

          return (
            device.kind ===
            "videoinput"
          );

        }
      );


    if (cameras.length === 0) {

      throw new Error(
        "カメラが見つかりません"
      );

    }


    /*
     * カメラ名を表示
     */
    console.log(
      "検出カメラ:",
      cameras
    );


    /*
     * 背面カメラ候補
     */
    const backCamera =
      cameras.find(
        function(camera) {

          const label =
            (
              camera.label ||
              ""
            ).toLowerCase();


          return (

            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("背面") ||
            label.includes("後")

          );

        }
      );


    /*
     * 背面カメラが見つかったらそれを使用
     *
     * 見つからない場合は、
     * 2台目以降を候補にする
     */
    let selectedCamera;


    if (backCamera) {

      selectedCamera =
        backCamera;

    } else if (
      cameras.length > 1
    ) {

      selectedCamera =
        cameras[
          cameras.length - 1
        ];

    } else {

      selectedCamera =
        cameras[0];

    }


    /*
     * 最初のストリームを停止
     */
    initialStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    status.textContent =
      "カメラを起動しています...";


    /*
     * ZXing
     */
    reader =
      new
      ZXingBrowser
        .BrowserMultiFormatReader();


    /*
     * 選択したカメラだけを使用
     */
    controls =
      await reader
        .decodeFromVideoDevice(

          selectedCamera.deviceId,

          video,

          function(
            resultCode,
            error
          ) {

            if (
              resultCode
            ) {

              onBarcode(
                resultCode.getText()
              );

            }

          }

        );


    running =
      true;


    startButton.disabled =
      true;

    startButton.textContent =
      "カメラ起動中";


    status.textContent =
      "背面カメラで読み取り中";


  } catch (error) {

    console.error(
      "CAMERA ERROR",
      error
    );


    status.textContent =
      "カメラ起動エラー: " +
      error.name +
      " / " +
      error.message;

  }

}


/*
 * バーコード読み取り
 */
async function onBarcode(code) {

  const now =
    Date.now();


  /*
   * 同じバーコードは
   * 2秒以内なら無視
   */
  if (

    code === lastCode &&

    now - lastCodeTime <
      SAME_CODE_INTERVAL

  ) {

    return;

  }


  lastCode =
    code;

  lastCodeTime =
    now;


  /*
   * ピッ
   */
  beep();


  /*
   * 表示
   */
  result.textContent =
    code;


  status.textContent =
    "読み取り: " +
    code;


  /*
   * Apps Scriptへ送信
   */
  try {

    await fetch(

      RELAY_URL,

      {

        method:
          "POST",

        mode:
          "no-cors",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body:
          "value=" +
          encodeURIComponent(code)

      }

    );


    status.textContent =
      "送信しました: " +
      code;


  } catch (error) {

    status.textContent =
      "送信エラー: " +
      error.message;

  }

}


/*
 * ピッ音
 */
function beep() {

  if (!audioContext) {
    return;
  }

  try {

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type =
      "sine";

    oscillator.frequency.value =
      1200;


    gain.gain.setValueAtTime(
      0.25,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.12
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.12
    );


  } catch (error) {

    console.log(
      "BEEP ERROR",
      error
    );

  }

}

</script>

</body>
</html>
