<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>バーコードスキャナー</title>

<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: white;
  color: black;

  font-family: sans-serif;
  text-align: center;
}

h1 {
  font-size: 22px;
  margin: 15px 0;
}

#connectionArea {
  margin: 15px auto;
  max-width: 500px;
}

#code {
  width: 100%;
  padding: 12px;
  font-size: 20px;
  text-align: center;
  text-transform: uppercase;
}

button {
  font-size: 20px;
  padding: 12px 20px;
  margin: 6px;
}

#status {
  font-size: 18px;
  min-height: 30px;
  margin: 10px;
  word-break: break-all;
}

#camera {
  position: relative;

  width: 100%;
  max-width: 600px;

  height: 230px;

  margin: 15px auto;

  background: white;

  overflow: hidden;
}

#video {
  position: absolute;

  width: 82%;
  height: 130px;

  left: 9%;
  top: 50px;

  object-fit: cover;

  background: #ddd;
}

#scanBox {
  position: absolute;

  width: 82%;
  height: 130px;

  left: 50%;
  top: 115px;

  transform:
    translate(-50%, -50%);

  border: 3px solid black;

  pointer-events: none;

  z-index: 10;
}

#result {
  font-size: 22px;
  margin: 15px;
  word-break: break-all;
}

</style>

</head>


<body>


<h1>
バーコードスキャナー
</h1>


<div id="connectionArea">

  <input
    id="code"
    type="text"
    maxlength="8"
    placeholder="接続コード"
    autocomplete="off"
  >

  <br>

  <button id="connectButton">
    接続
  </button>

</div>


<div id="status">
接続コードを入力してください
</div>


<button
  id="startButton"
  disabled
>
カメラ開始
</button>


<button
  id="switchButton"
  disabled
>
カメラ切替
</button>


<div id="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="scanBox"></div>

</div>


<div id="result"></div>


<script>


/*
 * Google Apps Script URL
 */
const RELAY_URL =
  "https://script.google.com/macros/s/AKfycbylaWMXqaZcO_tnsDMcg7YNhh9ZZKCR0hBr3iEYc3evlsMzZC2wFFBZgrG6_sCLhcIXAA/exec";


let connectionCode = "";

let reader = null;

let controls = null;

let cameras = [];

let currentCamera = 0;

let running = false;

let audioContext = null;

let lastCode = "";

let lastCodeTime = 0;


/*
 * 同じバーコードは2秒以内無視
 */
const SAME_CODE_INTERVAL = 2000;


/*
 * HTML
 */
const codeInput =
  document.getElementById(
    "code"
  );


const connectButton =
  document.getElementById(
    "connectButton"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const switchButton =
  document.getElementById(
    "switchButton"
  );


const status =
  document.getElementById(
    "status"
  );


const video =
  document.getElementById(
    "video"
  );


const result =
  document.getElementById(
    "result"
  );


/*
 * 接続ボタン
 */
connectButton.addEventListener(
  "click",
  connect
);


/*
 * Enterでも接続
 */
codeInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Enter"
    ) {

      connect();

    }

  }
);


/*
 * 接続
 */
async function connect() {

  const code =
    codeInput.value
      .trim()
      .toUpperCase();


  if (!code) {

    status.textContent =
      "接続コードを入力してください";

    return;

  }


  status.textContent =
    "接続を確認しています...";


  try {

    const response =
      await fetch(

        RELAY_URL +
        "?action=get&code=" +
        encodeURIComponent(
          code
        ) +
        "&_" +
        Date.now(),

        {
          cache: "no-store"
        }

      );


    const data =
      await response.json();


    /*
     * 存在しないコードならエラー
     */
    if (
      data.error
    ) {

      status.textContent =
        "接続コードが正しくありません";

      return;

    }


    /*
     * 接続成功
     */
    connectionCode =
      code;


    /*
     * 保存
     */
    localStorage.setItem(
      "barcodeConnectionCode",
      code
    );


    status.textContent =
      "接続しました: " +
      code;


    startButton.disabled =
      false;


  } catch (error) {

    console.error(
      error
    );


    status.textContent =
      "接続エラー: " +
      error.message;

  }

}


/*
 * 保存済みコードを復元
 */
const savedCode =
  localStorage.getItem(
    "barcodeConnectionCode"
  );


if (savedCode) {

  codeInput.value =
    savedCode;

}


/*
 * カメラ開始
 */
startButton.addEventListener(
  "click",
  startCamera
);


/*
 * カメラ切替
 */
switchButton.addEventListener(
  "click",
  switchCamera
);


/*
 * カメラ開始
 */
async function startCamera() {

  if (!connectionCode) {

    status.textContent =
      "先に接続してください";

    return;

  }


  if (running) {

    return;

  }


  /*
   * 音声
   */
  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (AudioContext) {

      audioContext =
        new AudioContext();


      if (
        audioContext.state ===
        "suspended"
      ) {

        await audioContext.resume();

      }

    }

  } catch (error) {

    console.log(
      error
    );

  }


  try {

    /*
     * カメラ許可
     */
    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: true,

          audio: false

        });


    /*
     * カメラ一覧
     */
    const devices =
      await navigator
        .mediaDevices
        .enumerateDevices();


    cameras =
      devices.filter(
        function(device) {

          return (
            device.kind ===
            "videoinput"
          );

        }
      );


    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    if (!cameras.length) {

      throw new Error(
        "カメラが見つかりません"
      );

    }


    currentCamera = 0;


    reader =
      new
      ZXingBrowser
        .BrowserMultiFormatReader();


    await startSelectedCamera();


    running = true;


    startButton.disabled =
      true;


    switchButton.disabled =
      false;


  } catch (error) {

    console.error(
      error
    );


    status.textContent =
      "カメラ起動エラー: " +
      error.name +
      " / " +
      error.message;

  }

}


/*
 * 選択したカメラを開始
 */
async function startSelectedCamera() {


  if (controls) {

    try {

      controls.stop();

    } catch (error) {

      console.log(error);

    }

    controls = null;

  }


  const camera =
    cameras[
      currentCamera
    ];


  if (!camera) {

    return;

  }


  status.textContent =
    "カメラ: " +
    (
      camera.label ||
      "カメラ " +
      (currentCamera + 1)
    );


  controls =
    await reader
      .decodeFromVideoDevice(

        camera.deviceId,

        video,

        function(
          resultCode,
          error
        ) {

          if (
            resultCode
          ) {

            onBarcode(
              resultCode.getText()
            );

          }

        }

      );

}


/*
 * カメラ切替
 */
async function switchCamera() {


  if (!cameras.length) {

    return;

  }


  currentCamera =
    (
      currentCamera + 1
    ) %
    cameras.length;


  try {

    await startSelectedCamera();

  } catch (error) {

    status.textContent =
      "カメラ切替エラー: " +
      error.message;

  }

}


/*
 * バーコード読み取り
 */
async function onBarcode(
  value
) {

  const now =
    Date.now();


  /*
   * 同じコードは2秒以内無視
   */
  if (

    value === lastCode &&

    now - lastCodeTime <
      SAME_CODE_INTERVAL

  ) {

    return;

  }


  lastCode =
    value;

  lastCodeTime =
    now;


  /*
   * ピッ
   */
  beep();


  result.textContent =
    value;


  status.textContent =
    "読み取り: " +
    value;


  /*
   * 接続コード付きで送信
   */
  try {

    await fetch(

      RELAY_URL,

      {

        method:
          "POST",

        mode:
          "no-cors",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body:

          "code=" +
          encodeURIComponent(
            connectionCode
          ) +

          "&value=" +
          encodeURIComponent(
            value
          )

      }

    );


    status.textContent =
      "送信しました: " +
      value;


  } catch (error) {

    status.textContent =
      "送信エラー: " +
      error.message;

  }

}


/*
 * ピッ音
 */
function beep() {

  if (!audioContext) {

    return;

  }


  try {

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      1200;


    gain.gain.setValueAtTime(

      0.25,

      audioContext.currentTime

    );


    gain.gain
      .exponentialRampToValueAtTime(

        0.001,

        audioContext.currentTime +
        0.12

      );


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(

      audioContext.currentTime +
      0.12

    );


  } catch (error) {

    console.log(
      error
    );

  }

}

</script>

</body>

</html>
