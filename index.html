<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>バーコードスキャナー</title>

<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: white;
  color: black;

  font-family: sans-serif;
  text-align: center;
}

h1 {
  font-size: 22px;
  margin: 15px 0;
}

#connectionArea {
  width: 100%;
  max-width: 500px;
  margin: 10px auto;
}

#code {
  width: 90%;
  max-width: 400px;

  padding: 12px;

  font-size: 20px;

  text-align: center;

  text-transform: uppercase;

  border: 2px solid #999;
}

button {
  font-size: 20px;

  padding: 12px 20px;

  margin: 6px;
}

button:disabled {
  opacity: 0.45;
}

#status {
  font-size: 18px;

  min-height: 30px;

  margin: 10px;

  word-break: break-all;
}


/*
 * カメラ表示領域
 */
#camera {

  position: relative;

  width: 100%;

  max-width: 600px;

  height: 230px;

  margin: 15px auto;

  background: white;

  overflow: hidden;
}


/*
 * カメラ映像
 */
#video {

  position: absolute;

  width: 82%;

  height: 130px;

  left: 9%;

  top: 50px;

  object-fit: cover;

  background: #ddd;
}


/*
 * 固定枠
 *
 * 点滅・アニメーションなし
 */
#scanBox {

  position: absolute;

  width: 82%;

  height: 130px;

  left: 50%;

  top: 115px;

  transform:
    translate(-50%, -50%);

  border: 3px solid black;

  pointer-events: none;

  z-index: 10;
}


/*
 * 読み取り結果
 */
#result {

  font-size: 22px;

  margin: 15px;

  word-break: break-all;
}

</style>

</head>


<body>


<h1>
バーコードスキャナー
</h1>


<!-- 接続コード -->

<div id="connectionArea">

  <input
    id="code"
    type="text"
    maxlength="8"
    placeholder="接続コード"
    autocomplete="off"
    autocapitalize="characters"
  >

  <br>

  <button
    id="connectButton"
  >
    接続
  </button>

</div>


<div id="status">
接続コードを入力してください
</div>


<!--
  接続するまで
  カメラ関連ボタンは無効
-->

<button
  id="startButton"
  disabled
>
カメラ開始
</button>


<button
  id="switchButton"
  disabled
>
カメラ切替
</button>


<!-- カメラ -->

<div id="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="scanBox"></div>

</div>


<div id="result"></div>


<script>


/*
 * Google Apps Script
 *
 * ここだけ変更してください。
 */
const RELAY_URL =
  "https://script.google.com/macros/s/AKfycbylaWMXqaZcO_tnsDMcg7YNhh9ZZKCR0hBr3iEYc3evlsMzZC2wFFBZgrG6_sCLhcIXAA/exec";


/*
 * 接続状態
 */
let connected = false;

let connectionCode = "";


/*
 * ZXing
 */
let reader = null;

let controls = null;


/*
 * カメラ一覧
 */
let cameras = [];

let currentCamera = 0;


/*
 * カメラ起動状態
 */
let running = false;


/*
 * 音声
 */
let audioContext = null;


/*
 * 同じバーコード制限
 */
let lastCode = "";

let lastCodeTime = 0;


/*
 * 2秒
 */
const SAME_CODE_INTERVAL =
  5000;


/*
 * HTML要素
 */
const codeInput =
  document.getElementById(
    "code"
  );


const connectButton =
  document.getElementById(
    "connectButton"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const switchButton =
  document.getElementById(
    "switchButton"
  );


const status =
  document.getElementById(
    "status"
  );


const video =
  document.getElementById(
    "video"
  );


const result =
  document.getElementById(
    "result"
  );


/*
 * 最初は必ずカメラ無効
 */
startButton.disabled =
  true;

switchButton.disabled =
  true;


/*
 * 接続ボタン
 */
connectButton.addEventListener(
  "click",
  connect
);


/*
 * Enterで接続
 */
codeInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Enter"
    ) {

      connect();

    }

  }
);


/*
 * 接続処理
 */
async function connect() {


  /*
   * まずカメラを完全に無効化
   */
  startButton.disabled =
    true;

  switchButton.disabled =
    true;


  connected =
    false;


  connectionCode =
    "";


  /*
   * 入力値
   */
  const code =
    codeInput.value
      .trim()
      .toUpperCase();


  /*
   * 8文字チェック
   */
  if (
    code.length !== 8
  ) {

    status.textContent =
      "接続コードは8文字です";

    return;

  }


  status.textContent =
    "接続コードを確認しています...";


  connectButton.disabled =
    true;


  try {


    /*
     * Apps Scriptへ
     * 接続コード確認
     */
    const response =
      await fetch(

        RELAY_URL +
        "?action=connect" +
        "&code=" +
        encodeURIComponent(
          code
        ) +
        "&_" +
        Date.now(),

        {
          cache:
            "no-store"
        }

      );


    const data =
      await response.json();


    /*
     * 認証失敗
     */
    if (
      !data.ok ||
      !data.connected
    ) {


      connected =
        false;


      connectionCode =
        "";


      startButton.disabled =
        true;


      switchButton.disabled =
        true;


      status.textContent =
        "接続コードが正しくありません";


      connectButton.disabled =
        false;


      return;

    }


    /*
     * 認証成功
     */
    connected =
      true;


    connectionCode =
      code;


    /*
     * 保存
     */
    localStorage.setItem(

      "barcodeConnectionCode",

      code

    );


    status.textContent =
      "接続しました";


    /*
     * ここで初めて
     * カメラ開始を許可
     */
    startButton.disabled =
      false;


  } catch (error) {


    connected =
      false;


    connectionCode =
      "";


    startButton.disabled =
      true;


    switchButton.disabled =
      true;


    status.textContent =
      "接続エラー: " +
      error.message;


  }


  connectButton.disabled =
    false;

}


/*
 * 保存済み接続コード
 */
const savedCode =
  localStorage.getItem(
    "barcodeConnectionCode"
  );


if (savedCode) {

  codeInput.value =
    savedCode;

}


/*
 * カメラ開始
 */
startButton.addEventListener(
  "click",
  startCamera
);


/*
 * カメラ切替
 */
switchButton.addEventListener(
  "click",
  switchCamera
);


/*
 * カメラ開始
 */
async function startCamera() {


  /*
   * 接続確認
   */
  if (!connected) {

    status.textContent =
      "先に接続してください";

    startButton.disabled =
      true;

    switchButton.disabled =
      true;

    return;

  }


  if (running) {

    return;

  }


  status.textContent =
    "カメラを起動しています...";


  /*
   * 音声初期化
   *
   * カメラ許可前に行う
   */
  try {


    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (AudioContext) {


      audioContext =
        new AudioContext();


      if (
        audioContext.state ===
        "suspended"
      ) {


        await
          audioContext.resume();


      }

    }


  } catch (error) {


    console.log(
      error
    );


  }


  try {


    /*
     * カメラ許可
     *
     * ここに来るのは
     * 接続成功後だけ
     */
    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:
            true,

          audio:
            false

        });


    /*
     * カメラ一覧
     */
    const devices =
      await navigator
        .mediaDevices
        .enumerateDevices();


    cameras =
      devices.filter(
        function(device) {

          return (
            device.kind ===
            "videoinput"
          );

        }
      );


    /*
     * 一時ストリーム停止
     */
    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    if (
      cameras.length === 0
    ) {

      throw new Error(
        "カメラが見つかりません"
      );

    }


    /*
     * 最初のカメラ
     */
    currentCamera =
      0;


    /*
     * ZXing
     */
    reader =
      new
      ZXingBrowser
        .BrowserMultiFormatReader();


    /*
     * 選択カメラ開始
     */
    await startSelectedCamera();


    running =
      true;


    startButton.disabled =
      true;


    switchButton.disabled =
      false;


  } catch (error) {


    console.error(
      "CAMERA ERROR:",
      error
    );


    running =
      false;


    startButton.disabled =
      false;


    switchButton.disabled =
      true;


    status.textContent =
      "カメラ起動エラー: " +
      error.name +
      " / " +
      error.message;

  }

}


/*
 * 選択中カメラを起動
 */
async function startSelectedCamera() {


  /*
   * 現在のカメラ停止
   */
  if (controls) {


    try {

      controls.stop();

    } catch (error) {

      console.log(
        error
      );

    }


    controls =
      null;

  }


  const camera =
    cameras[
      currentCamera
    ];


  if (!camera) {

    return;

  }


  status.textContent =
    "カメラ: " +
    (
      camera.label ||
      "カメラ " +
      (
        currentCamera +
        1
      )
    );


  /*
   * カメラ起動
   */
  controls =
    await reader
      .decodeFromVideoDevice(

        camera.deviceId,

        video,

        function(
          resultCode,
          error
        ) {


          if (
            resultCode
          ) {


            onBarcode(

              resultCode.getText()

            );


          }

        }

      );

}


/*
 * カメラ手動切替
 */
async function switchCamera() {


  /*
   * 接続していなければ不可
   */
  if (!connected) {

    return;

  }


  if (
    cameras.length === 0
  ) {

    return;

  }


  /*
   * 次のカメラ
   */
  currentCamera =

    (
      currentCamera +
      1
    ) %
    cameras.length;


  try {


    await
      startSelectedCamera();


  } catch (error) {


    status.textContent =
      "カメラ切替エラー: " +
      error.message;


  }

}


/*
 * バーコード読み取り
 */
async function onBarcode(
  value
) {


  /*
   * 接続確認
   */
  if (!connected) {

    return;

  }


  const now =
    Date.now();


  /*
   * 同じバーコードを
   * 2秒以内なら無視
   */
  if (

    value ===
      lastCode &&

    now -
      lastCodeTime <
      SAME_CODE_INTERVAL

  ) {

    return;

  }


  /*
   * 記録
   */
  lastCode =
    value;


  lastCodeTime =
    now;


  /*
   * ピッ
   */
  beep();


  /*
   * 表示
   */
  result.textContent =
    value;


  status.textContent =
    "読み取り: " +
    value;


  /*
   * 接続コード付きで送信
   */
  try {


    await fetch(

      RELAY_URL,

      {

        method:
          "POST",

        mode:
          "no-cors",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body:

          "code=" +
          encodeURIComponent(
            connectionCode
          ) +

          "&value=" +
          encodeURIComponent(
            value
          )

      }

    );


    status.textContent =
      "送信しました: " +
      value;


  } catch (error) {


    status.textContent =
      "送信エラー: " +
      error.message;


  }

}


/*
 * ピッ音
 */
function beep() {


  if (!audioContext) {

    return;

  }


  try {


    if (
      audioContext.state ===
      "suspended"
    ) {


      audioContext.resume();


    }


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      1200;


    gain.gain.setValueAtTime(

      0.25,

      audioContext.currentTime

    );


    gain.gain
      .exponentialRampToValueAtTime(

        0.001,

        audioContext.currentTime +
        0.12

      );


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(

      audioContext.currentTime +
      0.12

    );


  } catch (error) {


    console.log(
      error
    );


  }

}

</script>

</body>

</html>
